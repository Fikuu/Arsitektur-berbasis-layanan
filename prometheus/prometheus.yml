global:
  scrape_interval: 15s

scrape_configs:
  # RabbitMQ
  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq:15692"

  # MySQL
  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql-exporter:9104"

  # Eureka
  - job_name: "eureka-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "eureka-service:8761"

  # Auth
  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "auth-service:8091"

  # Product
  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "product-service:8080"

  # Order
  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "order-service:8081"

  # Notification
  - job_name: "notification-email"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "notification-email:8090"
