apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql-db

  template:
    metadata:
      labels:
        app: mysql-db

    spec:
      containers:
        - name: mysql-db
          image: mysql:8.4.9

          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root

            - name: MYSQL_DATABASE
              value: microservice_db

          ports:
            - containerPort: 3306
