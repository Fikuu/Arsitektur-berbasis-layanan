version: "3.8"

services:

  ####################################################
  # MYSQL
  ####################################################
  mysql-db:
    image: mysql:8.4.9
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: microservice_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - microservice-net

  ####################################################
  # MYSQL EXPORTER
  ####################################################
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    restart: always

    command:
      - "--mysqld.address=mysql-db:3306"
      - "--mysqld.username=exporter"

    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter123

    ports:
      - "9104:9104"

    depends_on:
      - mysql-db

    networks:
      - microservice-net

  ####################################################
  # RABBITMQ
  ####################################################
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >
        -rabbitmq_prometheus return_per_object_metrics true

    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

    networks:
      - microservice-net

  ####################################################
  # EUREKA SERVICE
  ####################################################
  eureka-service:
    build:
      context: ./eureka-service

    container_name: eureka-service
    restart: always

    ports:
      - "8761:8761"

    networks:
      - microservice-net

  ####################################################
  # AUTH SERVICE
  ####################################################
  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service
    restart: always

    ports:
      - "8091:8091"

    depends_on:
      - mysql-db
      - eureka-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/microservice_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

    networks:
      - microservice-net

  ####################################################
  # PRODUCT SERVICE
  ####################################################
  product-service:
    build:
      context: ./Product

    container_name: product-service
    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - mysql-db
      - eureka-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/microservice_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

    networks:
      - microservice-net

  ####################################################
  # ORDER SERVICE
  ####################################################
  order-service:
    build:
      context: ./Order

    container_name: order-service
    restart: always

    ports:
      - "8081:8081"

    depends_on:
      - mysql-db
      - rabbitmq
      - eureka-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/microservice_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

    networks:
      - microservice-net

  ####################################################
  # NOTIFICATION EMAIL
  ####################################################
  notification-email:
    build:
      context: ./notification-email

    container_name: notification-email
    restart: always

    ports:
      - "8090:8090"

    depends_on:
      - rabbitmq
      - eureka-service

    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

    networks:
      - microservice-net

  ####################################################
  # PROMETHEUS
  ####################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always

    ports:
      - "9091:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    depends_on:
      - eureka-service
      - auth-service
      - product-service
      - order-service
      - notification-email
      - rabbitmq
      - mysql-exporter

    networks:
      - microservice-net

  ####################################################
  # GRAFANA
  ####################################################
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - microservice-net

  ####################################################
  # ELASTICSEARCH
  ####################################################
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    restart: always

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - microservice-net

  ####################################################
  # LOGSTASH
  ####################################################
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    restart: always

    ports:
      - "3535:3535"

    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

    depends_on:
      - elasticsearch

    networks:
      - microservice-net

  ####################################################
  # KIBANA
  ####################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    restart: always

    ports:
      - "5601:5601"

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    depends_on:
      - elasticsearch

    networks:
      - microservice-net

volumes:
  mysql_data:
  grafana-storage:
  elasticsearch-data:

networks:
  microservice-net:
    driver: bridge